name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SITE_URL: https://podcast.boxenstopp-klettgau.ch

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build --url "$SITE_URL"

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir "${{ github.workspace }}/_site"
            --remap "^https://podcast\.boxenstopp-klettgau\.ch file://${{ github.workspace }}/_site"
            '${{ github.workspace }}/_site/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  episodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check episode metadata
        run: |
          pip install mutagen
          python scripts/check_episode_metadata.py
