repos:
  - repo: local
    hooks:
      - id: podcast-content
        name: podcast content checks
        entry: python3 scripts/check.py --fix
        language: system
        pass_filenames: false
        always_run: true
      - id: site-links
        name: check built site links
        entry: bash scripts/check_links.sh
        language: system
        pass_filenames: false
        always_run: true
